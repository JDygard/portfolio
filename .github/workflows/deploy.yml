name: Build and deploy to S3

# Deploys the prerendered site to S3 + invalidates CloudFront on every push to main.
# Auth is via GitHub OIDC -> an IAM role (no long-lived AWS keys stored in the repo).
# One-time AWS setup is documented in DEPLOY.md. The three repo *variables* below
# (Settings -> Secrets and variables -> Actions -> Variables) must be set first:
#   AWS_ROLE_ARN          e.g. arn:aws:iam::123456789012:role/portfolio-deploy
#   AWS_REGION            e.g. eu-north-1
#   S3_BUCKET             e.g. my-portfolio-bucket
#   CLOUDFRONT_DIST_ID    e.g. E1A2B3C4D5E6F7

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a deploy manually from the Actions tab

# Required for GitHub to mint the OIDC token used to assume the AWS role.
permissions:
  id-token: write
  contents: read

# Avoid overlapping deploys; cancel an in-progress run if a newer push lands.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (client + SSR + prerender)
        run: npm run build

      - name: Verify prerendered CSS
        run: |
          set -euo pipefail

          css_hrefs="$(grep -oE 'href="/assets/[^"]+\.css"' dist/index.html | sed -E 's/^href="//; s/"$//')"
          if [[ -z "${css_hrefs}" ]]; then
            echo "dist/index.html does not link a bundled CSS asset." >&2
            exit 1
          fi

          found_content_rules=false
          while IFS= read -r css_href; do
            css_file="dist${css_href}"
            if [[ ! -f "${css_file}" ]]; then
              echo "dist/index.html links a missing CSS asset: ${css_file}" >&2
              exit 1
            fi

            if grep -q '\.content' "${css_file}"; then
              found_content_rules=true
            fi
          done <<< "${css_hrefs}"

          if [[ "${found_content_rules}" != "true" ]]; then
            echo "Bundled CSS is missing the .content layout rules." >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Pass 1: hashed assets — safe to cache forever (filenames change on rebuild).
      - name: Sync hashed assets (immutable cache)
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude index.html

      # Pass 2: index.html — must never cache, or visitors get a stale page after deploy.
      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DIST_ID }}" \
            --paths "/" "/index.html"
